<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة درس جديد - أكاديمية فارس</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f8f9fa; font-family: Tahoma, sans-serif; }</style>
</head>
<body>
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow p-4">
        <h3 class="text-success mb-3">➕ إضافة درس جديد للمستوى {{ level }}</h3>
        <form action="/add_lesson" method="POST">
            <input type="hidden" name="level" value="{{ level }}">
            <div class="mb-3">
                <label class="form-label fw-bold">عنوان الدرس:</label>
                <input type="text" name="title" class="form-control" placeholder="مثال: Lesson: Introduction to Grammar" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">رقم الترتيب (Order):</label>
                <input type="number" name="lesson_order" class="form-control" value="1" min="1" required>
                <small class="text-muted">حدد مكانه في القائمة (1 للأول، 2 للثاني، إلخ)</small>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">رابط يوتيوب أو الـ ID:</label>
                <input type="text" name="youtube_url" class="form-control" placeholder="https://www.youtube.com/watch?v=xxxxxx" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">وصف الدرس:</label>
                <textarea name="description" class="form-control" rows="3" placeholder="اكتب نبذة مختصرة عن محتوى الدرس..."></textarea>
            </div>
            <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-secondary">إلغاء والعودة</a>
                <button type="submit" class="btn btn-success px-4">حفظ وإضافة الدرس</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
