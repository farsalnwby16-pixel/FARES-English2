<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شهادة إتمام الكورس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #fff; font-family: 'Cairo', sans-serif; text-align: center; padding: 20px; }
        .cert { background: #fff; color: #1e293b; padding: 30px; border-radius: 12px; max-width: 700px; margin: 20px auto; border: 6px solid #c5a059; }
        .name { font-size: 28px; color: #059669; font-weight: bold; border-bottom: 2px solid #c5a059; display: inline-block; padding: 0 15px; margin: 15px 0; }
        .btn { background: #059669; color: #fff; border: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 20px; cursor: pointer; margin-top: 15px; }
        @media print { .btn { display: none; } }
    </style>
</head>
<body>
    <div class="cert">
        <h2 style="color: #c5a059;">Fares El-Noby Academy</h2>
        <h1>شهادة إتمام دورة تعليمية</h1>
        <p>تمنح هذه الشهادة بكل فخر للطالب/ـة:</p>
        <div class="name">{{ name }}</div>
        <p>تقديرًا لاجتيازه بنجاح كافة متطلبات الكورس.</p>
        <p><b>تاريخ الإصدار:</b> {{ date }}</p>
    </div>
    <button class="btn" onclick="window.print()">🖨️ طباعة الشهادة / حفظ كـ PDF</button>
</body>
</html>
